events { worker_connections 1024; }

http {
    log_format aegis escape=json '{"t":"$time_iso8601","uri":"$request_uri","status":$status,"rt":$request_time,"up":"$upstream_addr","rule":"$aegis_rule"}';
    access_log /dev/stdout aegis;

    # Virtual patches written by the OODA-Aegis edge tier.
    include /etc/nginx/aegis/dynamic_rules.conf;

    upstream active_backend {
        include /etc/nginx/aegis/upstream.conf;
    }

    server {
        listen 80;
        server_name _;
        add_header Access-Control-Allow-Origin * always;
        default_type application/json;

        location / {
            if ($aegis_drop) {
                return 403 '{"error":"SecurityAccessDenied","message":"Request dropped at the proxy by virtual patch $aegis_rule (AEGIS-VPATCH).","rule":"$aegis_rule"}';
            }
            proxy_pass http://active_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
        }
    }
}
